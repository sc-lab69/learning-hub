<body>
  <main class="shell">
    <header class="topbar">
      <button class="logo-button" data-home aria-label="กลับหน้าหลัก"><span class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v16M3 5a2 2 0 0 1 2-2h3a5 5 0 0 1 4 2 5 5 0 0 1 4-2h3a2 2 0 0 1 2 2v14h-5a5 5 0 0 0-4 2 5 5 0 0 0-4-2H3V5Z"/></svg><span class="brand-dot">↗</span></span><span class="brand-copy"><b>คลังสื่อ</b><small>การเรียนรู้</small></span></span></button>
      <button class="admin-btn" id="open-login" aria-haspopup="dialog">🔒 ผู้ดูแลระบบ</button>
    </header>
    <section class="wrap"><nav class="crumbs" id="breadcrumbs"></nav><div id="app"></div></section>
    <footer><span class="brand"><span class="brand-mark">📖</span></span><p>รวมสื่อดี ๆ ให้ครูหยิบใช้ได้ทันที</p><span>© 2026</span></footer>
  </main>

  <div class="modal-layer" id="login-layer" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <section class="modal"><button class="modal-close" data-close aria-label="ปิด">×</button><div class="modal-head"><span class="modal-badge">🔒</span><div><h2 id="login-title">เข้าสู่ระบบผู้ดูแล</h2><p>กรอกรหัสผ่านเพื่อเพิ่มวิชา ชั้นเรียน และสื่อการสอน</p></div></div><form class="login-form" id="login-form"><div class="field"><label for="password">รหัสผ่าน</label><input class="control" id="password" type="password" autocomplete="current-password" placeholder="••••••••••••" required></div><button class="btn btn-primary" id="login-submit">เข้าสู่หน้าจัดการ <span>↗</span></button></form></section>
  </div>

  <div class="modal-layer" id="admin-layer" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <section class="modal admin-modal"><button class="modal-close" data-close aria-label="ปิด">×</button><div class="modal-head"><span class="modal-badge">⚙️</span><div><h2 id="admin-title">จัดการคลังสื่อ</h2><p>เพิ่มข้อมูลใหม่แล้วหน้าเว็บจะอัปเดตตาม Google Sheet</p></div></div><div class="status-panel"><b id="connection-status"></b><p id="connection-note"></p></div><div class="tabs"><button class="tab active" data-tab="resource">เพิ่มสื่อ</button><button class="tab" data-tab="grade">เพิ่มชั้นเรียน</button><button class="tab" data-tab="subject">เพิ่มวิชา</button></div>
      <section class="tab-page active" data-page="resource"><form class="admin-form" id="resource-form"><div class="field full"><label for="resource-grade">ชั้นเรียน</label><select class="control" id="resource-grade" required></select></div><div class="field"><label for="resource-title">ชื่อสื่อ</label><input class="control" id="resource-title" placeholder="เช่น ใบงานระบบสุริยะ" required></div><div class="field"><label for="resource-type">ประเภทสื่อ</label><select class="control" id="resource-type"><option value="link">เว็บไซต์ / ลิงก์</option><option value="video">วิดีโอ</option><option value="slides">สไลด์</option><option value="file">อัปโหลดไฟล์</option></select></div><div class="field full"><label for="resource-description">คำอธิบาย</label><textarea class="control" id="resource-description" placeholder="อธิบายสั้น ๆ ว่าสื่อนี้ใช้สอนเรื่องอะไร"></textarea></div><div class="field full" id="url-field"><label for="resource-url">ลิงก์สื่อ</label><input class="control" id="resource-url" type="url" placeholder="https://..."></div><div class="field full hidden" id="file-field"><label for="resource-file">เลือกไฟล์ (สูงสุด 8 MB)</label><input class="control" id="resource-file" type="file"><small class="file-note">รองรับ PDF, Word, PowerPoint, รูปภาพ และไฟล์ทั่วไป</small></div><button class="btn btn-primary save" type="submit">＋ เพิ่มสื่อการสอน</button></form></section>
      <section class="tab-page" data-page="grade"><form class="admin-form" id="grade-form"><div class="field full"><label for="grade-subject">วิชา</label><select class="control" id="grade-subject" required></select></div><div class="field full"><label for="grade-name">ชื่อชั้นเรียน</label><input class="control" id="grade-name" placeholder="เช่น ประถมศึกษาปีที่ 3" required></div><button class="btn btn-primary save" type="submit">＋ เพิ่มชั้นเรียน</button></form></section>
      <section class="tab-page" data-page="subject"><form class="admin-form" id="subject-form"><div class="field"><label for="subject-name">ชื่อวิชา</label><input class="control" id="subject-name" placeholder="เช่น ภาษาอังกฤษ" required></div><div class="field"><label for="subject-icon">ไอคอน</label><select class="control" id="subject-icon"><option value="science">🔬 วิทยาศาสตร์</option><option value="math">🧮 คณิตศาสตร์</option><option value="thai">📚 ภาษา / การอ่าน</option><option value="computer">💻 คอมพิวเตอร์</option></select></div><div class="field full"><label for="subject-description">คำอธิบาย</label><textarea class="control" id="subject-description" placeholder="คำอธิบายสั้น ๆ ของหมวดวิชา"></textarea></div><div class="field full"><label>สีประจำวิชา</label><div class="tone-picker"><button class="tone mint active" type="button" data-tone="mint" aria-label="เขียว"></button><button class="tone sky" type="button" data-tone="sky" aria-label="ฟ้า"></button><button class="tone coral" type="button" data-tone="coral" aria-label="ส้ม"></button><button class="tone violet" type="button" data-tone="violet" aria-label="ม่วง"></button></div></div><button class="btn btn-primary save" type="submit">＋ เพิ่มวิชา</button></form></section>
    </section>
  </div>

    const GOOGLE_APPS_SCRIPT_URL = "";
    const ADMIN_PASSWORD = "com123456789";

    const sampleSubjects=[
      {id:"science",name:"วิทยาศาสตร์",description:"ทดลอง สังเกต และค้นพบสิ่งรอบตัว",tone:"mint",icon:"science",grades:[{id:"science-p4",name:"ประถมศึกษาปีที่ 4",resources:[{id:"r1",title:"ระบบสุริยะของเรา",description:"สไลด์ประกอบบทเรียนพร้อมกิจกรรมท้ายคาบ",type:"slides",url:"https://docs.google.com/presentation/"},{id:"r2",title:"ใบงานเรื่องแรงและการเคลื่อนที่",description:"แบบฝึกหัด PDF สำหรับพิมพ์แจกนักเรียน",type:"file",url:"https://drive.google.com/"}]},{id:"science-p5",name:"ประถมศึกษาปีที่ 5",resources:[]},{id:"science-p6",name:"ประถมศึกษาปีที่ 6",resources:[]}]},
      {id:"math",name:"คณิตศาสตร์",description:"คิดเป็น เห็นแบบแผน และแก้โจทย์อย่างมั่นใจ",tone:"sky",icon:"math",grades:[{id:"math-p4",name:"ประถมศึกษาปีที่ 4",resources:[]},{id:"math-p5",name:"ประถมศึกษาปีที่ 5",resources:[]},{id:"math-p6",name:"ประถมศึกษาปีที่ 6",resources:[]}]},
      {id:"thai",name:"ภาษาไทย",description:"อ่านคล่อง เขียนดี และสื่อสารอย่างสร้างสรรค์",tone:"coral",icon:"thai",grades:[{id:"thai-p4",name:"ประถมศึกษาปีที่ 4",resources:[]},{id:"thai-p5",name:"ประถมศึกษาปีที่ 5",resources:[]}]},
      {id:"computer",name:"วิทยาการคำนวณ",description:"ออกแบบความคิด เขียนโปรแกรม และใช้เทคโนโลยี",tone:"violet",icon:"computer",grades:[{id:"computer-p6",name:"ประถมศึกษาปีที่ 6",resources:[{id:"r3",title:"เริ่มต้นเขียนโปรแกรมด้วย Scratch",description:"เว็บไซต์ฝึกเขียนโปรแกรมแบบลากและวาง",type:"link",url:"https://scratch.mit.edu/"},{id:"r4",title:"วิดีโอ: รู้จักสัญลักษณ์ Flowchart",description:"ทบทวนผังงานภายใน 8 นาที",type:"video",url:"https://www.youtube.com/"}]}]}
    ];
    const iconMap={science:"🔬",math:"🧮",thai:"📚",computer:"💻"};
    const typeMap={file:["📄","ไฟล์เอกสาร"],link:["🔗","เว็บไซต์"],video:["▶️","วิดีโอ"],slides:["📊","สไลด์"]};
    let subjects=structuredClone(sampleSubjects),subjectId=null,gradeId=null,adminPassword="",selectedTone="mint";
    const $=selector=>document.querySelector(selector),$$=selector=>[...document.querySelectorAll(selector)];
    const esc=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    const safeUrl=value=>{try{const u=new URL(value,location.href);return ["https:","blob:"].includes(u.protocol)?u.href:"#"}catch{return "#"}};
    const uid=prefix=>`${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    const currentSubject=()=>subjects.find(s=>s.id===subjectId)||null;
    const currentGrade=()=>currentSubject()?.grades.find(g=>g.id===gradeId)||null;

    function toast(title,description="",type="success"){
      const item=document.createElement("div");item.className=`toast ${type}`;item.innerHTML=`<span>${type==="success"?"✅":"⚠️"}</span><div><strong>${esc(title)}</strong>${description?`<small>${esc(description)}</small>`:""}</div>`;$("#toasts").append(item);setTimeout(()=>item.remove(),3600);
    }
    function openModal(id){$(id).classList.add("open");setTimeout(()=>$(id).querySelector("input,button")?.focus(),30)}
    function closeModals(){$$(".modal-layer").forEach(m=>m.classList.remove("open"))}
    function goHome(){subjectId=null;gradeId=null;render()}
    function chooseSubject(id){subjectId=id;gradeId=null;render();scrollTo({top:0,behavior:"smooth"})}
    function chooseGrade(id){gradeId=id;render();scrollTo({top:0,behavior:"smooth"})}

    function renderBreadcrumbs(){const s=currentSubject(),g=currentGrade();$("#breadcrumbs").innerHTML=`<button data-home>⌂ หน้าหลัก</button>${s?`<span class="crumb-sep">›</span><button data-subject-home>${esc(s.name)}</button>`:""}${g?`<span class="crumb-sep">›</span><span>${esc(g.name)}</span>`:""}`;$$('[data-home]').forEach(b=>b.onclick=goHome);const sh=$('[data-subject-home]');if(sh)sh.onclick=()=>{gradeId=null;render()}}
    function render(){renderBreadcrumbs();const s=currentSubject(),g=currentGrade();if(!s)renderHome();else if(!g)renderGrades(s);else renderResources(s,g);refreshAdminOptions()}
    function renderHome(){
      $("#app").innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow">✦ เรียนรู้ได้ทุกที่ ทุกอุปกรณ์</span><h1>สื่อพร้อมใช้<br><em>หาเจอในไม่กี่คลิก</em></h1><p>เลือกวิชา เลือกชั้น แล้วเปิดไฟล์หรือเว็บไซต์การสอนได้ทันที</p></div><div class="hero-stat"><strong>${subjects.length}</strong><p>หมวดวิชา<br>พร้อมเรียนรู้</p><i>🎓</i></div></section><section class="heading"><div><span class="kicker">เลือกหมวดหมู่</span><h2>วันนี้อยากเรียนวิชาอะไร?</h2></div><p>กดที่การ์ดวิชาเพื่อเลือกชั้นเรียน</p></section><div class="subject-grid">${subjects.map((s,i)=>{const count=s.grades.reduce((n,g)=>n+g.resources.length,0);return `<button class="subject-card tone-${esc(s.tone)}" data-subject="${esc(s.id)}" style="--delay:${i*70}ms"><span class="subject-icon">${iconMap[s.icon]||"📖"}</span><span class="subject-content"><b>${esc(s.name)}</b><small>${esc(s.description)}</small></span><span class="subject-footer"><span>${s.grades.length} ชั้นเรียน · ${count} สื่อ</span><span class="round-arrow">↗</span></span></button>`}).join("")}</div>`;
      $$('[data-subject]').forEach(b=>b.onclick=()=>chooseSubject(b.dataset.subject));
    }
    function renderGrades(s){
      $("#app").innerHTML=`<section class="drill"><button class="back" data-home>← กลับไปเลือกวิชา</button><div class="drill-hero tone-${esc(s.tone)}"><span class="drill-icon">${iconMap[s.icon]||"📖"}</span><div><small>หมวดวิชา</small><h1>${esc(s.name)}</h1><p>${esc(s.description)}</p></div></div><div class="heading compact"><div><span class="kicker">เลือกชั้นเรียน</span><h2>เรียนอยู่ชั้นไหน?</h2></div></div><div class="grade-grid">${s.grades.map((g,i)=>`<button class="grade-card" data-grade="${esc(g.id)}" style="--delay:${i*60}ms"><span class="grade-no">${esc(g.name.replace("ประถมศึกษาปีที่ ","ป."))}</span><span class="grade-copy"><b>${esc(g.name)}</b><small>${g.resources.length?`${g.resources.length} รายการสื่อ`:"ยังไม่มีสื่อ"}</small></span><span>›</span></button>`).join("")}</div></section>`;
      $$('[data-home]').forEach(b=>b.onclick=goHome);$$('[data-grade]').forEach(b=>b.onclick=()=>chooseGrade(b.dataset.grade));
    }
    function renderResources(s,g){
      const cards=g.resources.map((r,i)=>{const meta=typeMap[r.type]||typeMap.link;return `<a class="resource-card" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer" style="--delay:${i*60}ms"><span class="resource-icon rtype-${esc(r.type)}">${meta[0]}</span><span class="resource-copy"><small>${meta[1]}</small><b>${esc(r.title)}</b><p>${esc(r.description)}</p></span><span class="open-icon">↗</span></a>`}).join("");
      $("#app").innerHTML=`<section class="drill"><button class="back" id="back-grades">← กลับไปเลือกชั้นเรียน</button><div class="resource-title"><span class="mini-icon tone-${esc(s.tone)}">${iconMap[s.icon]||"📖"}</span><div><small>${esc(s.name)}</small><h1>${esc(g.name)}</h1></div></div>${cards?`<div class="resource-grid">${cards}</div>`:`<div class="empty"><i>📖</i><h2>กำลังเตรียมสื่อสำหรับชั้นนี้</h2><p>ผู้ดูแลระบบสามารถเพิ่มไฟล์หรือลิงก์ได้จากปุ่มด้านบน</p></div>`}</section>`;$("#back-grades").onclick=()=>{gradeId=null;render()};
    }

    async function api(payload){const response=await fetch(GOOGLE_APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});const result=await response.json();if(!result.ok)throw new Error(result.error||"บันทึกข้อมูลไม่สำเร็จ");return result}
    async function loadData(){if(!GOOGLE_APPS_SCRIPT_URL)return;try{const response=await fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=list&t=${Date.now()}`,{cache:"no-store"});const result=await response.json();if(!result.ok||!Array.isArray(result.subjects))throw new Error();subjects=result.subjects;render()}catch{toast("ดึงข้อมูล Google Sheet ไม่ได้","กำลังแสดงข้อมูลตัวอย่าง","error")}}
    async function mutate(action,payload){if(GOOGLE_APPS_SCRIPT_URL){await api({action,password:adminPassword,...payload});await loadData()}else{demoMutation(action,payload)}toast("บันทึกเรียบร้อย",GOOGLE_APPS_SCRIPT_URL?"ข้อมูลอัปเดตใน Google Sheet แล้ว":"บันทึกในโหมดตัวอย่างสำหรับรอบนี้")}
    function demoMutation(action,p){if(action==="addSubject")subjects.push({id:uid("subject"),name:p.name,description:p.description,icon:p.icon,tone:p.tone,grades:[]});if(action==="addGrade"){const s=subjects.find(x=>x.id===p.subjectId);if(s)s.grades.push({id:uid("grade"),name:p.name,resources:[]})}if(action==="addResource"){for(const s of subjects){const g=s.grades.find(x=>x.id===p.gradeId);if(g){g.resources.push({id:uid("resource"),title:p.title,description:p.description,type:p.type,url:p.url||"#"});break}}}render()}
    function refreshAdminOptions(){const subjectOptions=subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");$("#grade-subject").innerHTML=subjectOptions;$("#resource-grade").innerHTML=subjects.flatMap(s=>s.grades.map(g=>`<option value="${esc(g.id)}">${esc(s.name)} · ${esc(g.name)}</option>`)).join("");const connected=Boolean(GOOGLE_APPS_SCRIPT_URL);$("#connection-status").className=connected?"connected":"demo";$("#connection-status").textContent=connected?"☁ เชื่อม Google Sheet แล้ว":"◌ โหมดตัวอย่าง";$("#connection-note").textContent=connected?"ข้อมูลพร้อมใช้ทุกอุปกรณ์ทันที":"ใส่ Web App URL ในไฟล์ก่อนนำไปใช้จริง"}
    async function filePayload(file){if(!file)throw new Error("กรุณาเลือกไฟล์");if(file.size>8*1024*1024)throw new Error("ไฟล์ต้องมีขนาดไม่เกิน 8 MB");const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=reject;reader.readAsDataURL(file)});return{fileName:file.name,mimeType:file.type||"application/octet-stream",fileData:data}}
    function setBusy(button,busy){button.disabled=busy;button.innerHTML=busy?'<span class="loader"></span> กำลังบันทึก...':button.dataset.label}

    $("#open-login").onclick=()=>openModal("#login-layer");$$('[data-close]').forEach(b=>b.onclick=closeModals);$$('.modal-layer').forEach(layer=>layer.onclick=e=>{if(e.target===layer)closeModals()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModals()});
    $("#login-form").onsubmit=async e=>{e.preventDefault();const button=$("#login-submit");button.dataset.label=button.innerHTML;setBusy(button,true);try{adminPassword=$("#password").value;if(GOOGLE_APPS_SCRIPT_URL)await api({action:"authenticate",password:adminPassword});else if(adminPassword!==ADMIN_PASSWORD)throw new Error("รหัสผ่านไม่ถูกต้อง");closeModals();openModal("#admin-layer");toast("เข้าสู่ระบบสำเร็จ")}catch(error){toast("เข้าสู่ระบบไม่ได้",error.message||"รหัสผ่านไม่ถูกต้อง","error")}finally{setBusy(button,false)}};
    $$('.tab').forEach(tab=>tab.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle("active",x===tab));$$('.tab-page').forEach(p=>p.classList.toggle("active",p.dataset.page===tab.dataset.tab))});
    $$('.tone').forEach(t=>t.onclick=()=>{selectedTone=t.dataset.tone;$$('.tone').forEach(x=>x.classList.toggle("active",x===t))});
    $("#resource-type").onchange=e=>{const file=e.target.value==="file";$("#file-field").classList.toggle("hidden",!file);$("#url-field").classList.toggle("hidden",file)};
    $("#subject-form").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.dataset.label=b.innerHTML;setBusy(b,true);try{await mutate("addSubject",{name:$("#subject-name").value.trim(),description:$("#subject-description").value.trim(),icon:$("#subject-icon").value,tone:selectedTone});e.target.reset()}catch(error){toast("บันทึกไม่สำเร็จ",error.message,"error")}finally{setBusy(b,false)}};
    $("#grade-form").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.dataset.label=b.innerHTML;setBusy(b,true);try{await mutate("addGrade",{subjectId:$("#grade-subject").value,name:$("#grade-name").value.trim()});e.target.reset()}catch(error){toast("บันทึกไม่สำเร็จ",error.message,"error")}finally{setBusy(b,false)}};
    $("#resource-form").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.dataset.label=b.innerHTML;setBusy(b,true);try{const type=$("#resource-type").value;let extra={};let url=$("#resource-url").value.trim();if(type==="file"){const file=$("#resource-file").files[0];if(GOOGLE_APPS_SCRIPT_URL)extra=await filePayload(file);else url=URL.createObjectURL(file)}else if(!url.startsWith("https://"))throw new Error("ลิงก์ต้องขึ้นต้นด้วย https://");await mutate("addResource",{gradeId:$("#resource-grade").value,title:$("#resource-title").value.trim(),description:$("#resource-description").value.trim(),type,url,...extra});e.target.reset();$("#file-field").classList.add("hidden");$("#url-field").classList.remove("hidden")}catch(error){toast("บันทึกไม่สำเร็จ",error.message,"error")}finally{setBusy(b,false)}};

    render();loadData();
  </script>
</body>
</html>
